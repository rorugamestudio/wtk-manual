name: 💡 Feature Request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Modelling
        - Splines
        - Roads
        - Buildings
        - Terrain
        - Spawners / More
        - World Toolkit window / Settings
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Workarounds or other tools you use for this.
  - type: textarea
    id: media
    attributes:
      label: References
      description: Screenshots, sketches or examples from other tools.

[project]
site_name = "World Toolkit Manual"
site_url = "https://rorugamestudio.github.io/wtk-manual/"
site_description = "User manual for World Toolkit, a world-building toolkit for Unity."
repo_url = "https://github.com/rorugamestudio/wtk-manual"
repo_name = "rorugamestudio/wtk-manual"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/wtk.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Installation" = "getting-started/installation.md" },
    { "The World Toolkit Window" = "getting-started/world-toolkit-window.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "Modelling" = [
    "modelling/index.md",
    { "Editable Meshes" = "modelling/editable-meshes.md" },
    { "Primitives" = "modelling/primitives.md" },
    { "Selection" = "modelling/selection.md" },
    { "Transform" = "modelling/transform.md" },
    { "Editing Tools" = "modelling/editing-tools.md" },
    { "UVs" = "modelling/uvs.md" },
    { "Booleans" = "modelling/booleans.md" },
    { "Decals" = "modelling/decals.md" },
    { "Modelling Settings" = "modelling/settings.md" },
  ] },
  { "Splines" = [
    "splines/index.md",
    { "Spline Container" = "splines/spline-container.md" },
    { "Point Anchors" = "splines/point-anchors.md" },
    { "Link Groups" = "splines/link-groups.md" },
    { "Spline Settings" = "splines/settings.md" },
  ] },
  { "Roads" = [
    "roads/index.md",
    { "Creating Roads" = "roads/creating-roads.md" },
    { "Profiles and Layers" = "roads/profiles-and-layers.md" },
    { "Junctions" = "roads/junctions.md" },
    { "Anchored Connections" = "roads/anchored-connections.md" },
    { "City Blocks" = "roads/city-blocks.md" },
    { "Roads Settings" = "roads/settings.md" },
  ] },
  { "Buildings" = [
    "buildings/index.md",
    { "Buildings and Volumes" = "buildings/buildings-and-volumes.md" },
    { "Building Rules" = "buildings/building-rules.md" },
    { "Roofs" = "buildings/roofs.md" },
    { "Building Blocks" = "buildings/building-blocks.md" },
    { "Style Wizard" = "buildings/style-wizard.md" },
    { "Buildings Settings" = "buildings/settings.md" },
  ] },
  { "Terrain" = [
    "terrain/index.md",
    { "Stamps" = "terrain/stamps.md" },
    { "Masks" = "terrain/masks.md" },
    { "Height" = "terrain/height.md" },
    { "Erosion and Smoothing" = "terrain/erosion-and-smoothing.md" },
    { "Textures" = "terrain/textures.md" },
    { "Trees" = "terrain/trees.md" },
    { "Details" = "terrain/details.md" },
    { "Holes" = "terrain/holes.md" },
    { "Terrain Snap" = "terrain/terrain-snap.md" },
    { "Terrain Settings" = "terrain/settings.md" },
  ] },
  { "More" = [
    "more/index.md",
    { "Array Spawner" = "more/array-spawner.md" },
    { "Area Spawner" = "more/area-spawner.md" },
    { "More Settings" = "more/settings.md" },
  ] },
  { "Support" = [
    "support/index.md",
    { "Reporting Issues" = "support/reporting-issues.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "wtk/world"

[project.theme.icon.admonition]
tip = "lucide/lightbulb"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
commit_hash = "0045e82a9187da9ee41492606b49e3cc0fa8dd4d"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rorugamestudio/wtk-manual"
name = "Manual and issues on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/rorugamestudio"
name = "@rorugamestudio on X"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
